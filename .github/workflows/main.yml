name: AccountExpress CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18.x'

jobs:
  # ============================================
  # JOB 1: VALIDACIÓN Y TESTING
  # ============================================
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📚 Install dependencies
        run: npm ci
        
      - name: 🔍 Lint code
        run: npm run lint
        continue-on-error: true
        
      - name: 🧪 Run tests
        run: npm test
        env:
          CI: true
          
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        if: success()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          
      - name: 🏗️ Build project
        run: npm run build
        env:
          # Variables de entorno para build (opcional)
          VITE_TSA_URL: ${{ secrets.VITE_TSA_URL }}
          
      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ============================================
  # JOB 2: SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔒 Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
        
      - name: 🔍 Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ============================================
  # JOB 3: AUTO-RELEASE (solo en main)
  # ============================================
  release:
    name: Auto Release
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📚 Install dependencies
        run: npm ci
        
      - name: 🏗️ Build for production
        run: npm run build
        env:
          NODE_ENV: production
          VITE_TSA_URL: ${{ secrets.VITE_TSA_URL }}
          
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist-${{ github.sha }}
          path: dist/
          
      - name: 📝 Extract version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          
      - name: 🏷️ Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.package_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          
      - name: 📦 Create Release Archive
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p release
          cp -r dist release/
          cp README.md release/
          cp CHANGELOG*.md release/ 2>/dev/null || true
          cp ESTADO-ACTUAL-SISTEMA.md release/ 2>/dev/null || true
          cp MANUAL_AUDITORIA_RFC3161.md release/ 2>/dev/null || true
          cp MANUAL_USUARIO_COMPLETO.md release/ 2>/dev/null || true
          cd release
          zip -r ../accountexpress-${{ steps.package_version.outputs.version }}.zip .
          cd ..
          
      - name: 📋 Generate Release Notes
        if: steps.check_tag.outputs.exists == 'false'
        id: release_notes
        run: |
          if [ -f "CHANGELOG_v${{ steps.package_version.outputs.version }}.md" ]; then
            cat "CHANGELOG_v${{ steps.package_version.outputs.version }}.md" > release_notes.md
          else
            echo "# AccountExpress v${{ steps.package_version.outputs.version }}" > release_notes.md
            echo "" >> release_notes.md
            echo "## Changes" >> release_notes.md
            git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD >> release_notes.md
          fi
          
      - name: 🚀 Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.package_version.outputs.tag }}
          name: AccountExpress v${{ steps.package_version.outputs.version }}
          body_path: release_notes.md
          files: |
            accountexpress-${{ steps.package_version.outputs.version }}.zip
            README.md
            CHANGELOG*.md
            ESTADO-ACTUAL-SISTEMA.md
            MANUAL_AUDITORIA_RFC3161.md
            MANUAL_USUARIO_COMPLETO.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 📢 Release created
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "✅ Release v${{ steps.package_version.outputs.version }} created successfully!"
          echo "📦 Download: https://github.com/${{ github.repository }}/releases/tag/${{ steps.package_version.outputs.tag }}"

  # ============================================
  # JOB 4: DEPLOY DOCUMENTATION
  # ============================================
  docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📁 Create docs directory
        run: |
          mkdir -p docs
          
      - name: 📝 Copy documentation files
        run: |
          cp README.md docs/
          cp CHANGELOG*.md docs/ 2>/dev/null || true
          cp ESTADO-ACTUAL-SISTEMA.md docs/ 2>/dev/null || true
          cp MANUAL_AUDITORIA_RFC3161.md docs/ 2>/dev/null || true
          cp MANUAL_USUARIO_COMPLETO.md docs/ 2>/dev/null || true
          cp AUDITORIA_QA_SENIOR.md docs/ 2>/dev/null || true
          cp FINALIZACION_COMPLETA.md docs/ 2>/dev/null || true
          
      - name: 📚 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: update documentation'

  # ============================================
  # JOB 5: NOTIFY SUCCESS
  # ============================================
  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [validate, security, release, docs]
    if: success()
    
    steps:
      - name: ✅ Pipeline Success
        run: |
          echo "🎉 All jobs completed successfully!"
          echo "✅ Validation: PASSED"
          echo "✅ Security: PASSED"
          echo "✅ Release: COMPLETED"
          echo "✅ Documentation: DEPLOYED"
